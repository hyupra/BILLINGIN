server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Docker's embedded DNS, with a short TTL so nginx re-resolves "app"
    # instead of caching its IP forever. Without this, nginx sends every
    # FastCGI request to app's OLD IP after app gets recreated (e.g. a
    # rebuild) and nginx itself doesn't — "Connection refused" / 502 until
    # someone notices and restarts nginx by hand.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

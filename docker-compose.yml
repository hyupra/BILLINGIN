services:
  nginx:
    build: ./docker/nginx
    ports: ["8080:80"]
    depends_on: [app]
    restart: unless-stopped

  app:
    build: .
    command: php-fpm
    env_file: .env
    restart: unless-stopped
    depends_on:
      mssql: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: php artisan horizon
    env_file: .env
    restart: unless-stopped
    depends_on:
      mssql: { condition: service_healthy }
      redis: { condition: service_started }

  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    restart: unless-stopped
    depends_on:
      mssql: { condition: service_healthy }
      redis: { condition: service_started }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data: {}
  mssql-data: {}
